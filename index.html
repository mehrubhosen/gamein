<!DOCTYPE html>
<html lang="en">
<head>

new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','GTM-PND3KKQL');</script>
<!-- End Google Tag Manager -->
<meta charset="UTF-8">
<title>Advanced Tracking Practice</title>

<style>
body { font-family: Arial; margin: 0; }
header { background:#222; color:#fff; padding:15px; }
.section { padding:40px; border-bottom:1px solid #ccc; }
button { margin:5px; padding:10px; }
.big { height:800px; background:#eee; }
.hidden { margin-top:200px; padding:20px; background:orange; }
</style>
</head>

<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PND3KKQL"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<header>
  <h2>Advanced Tracking Practice</h2>
</header>

<div class="section">
  <h3>Navigation</h3>
  <button onclick="track('navigation_click')">Home</button>
  <button onclick="track('navigation_click')">About</button>
</div>

<div class="section">
  <h3>Buttons</h3>
  <button onclick="track('button_click')">CTA Button</button>
  <button onclick="track('contact_click')">Contact</button>
  <button onclick="track('phone_click')">Call</button>
  <button onclick="track('email_click')">Email</button>
  <button onclick="track('whatsapp_click')">WhatsApp</button>
</div>

<div class="section">
  <h3>Form</h3>
  <form id="form">
    <input type="text" placeholder="Name" required><br><br>
    <input type="email" placeholder="Email" required><br><br>
    <button type="submit">Submit</button>
  </form>
</div>

<div class="section">
  <h3>Auth</h3>
  <button onclick="track('login')">Login</button>
  <button onclick="track('sign_up')">Sign Up</button>
</div>

<div class="section">
  <h3>Search</h3>
  <input type="text" placeholder="Search..." onfocus="track('form_start')" oninput="track('site_search')">
</div>

<div class="section">
  <h3>Download + Outbound</h3>
  <a href="#" onclick="track('file_download')">Download</a><br><br>
  <a href="https://google.com" target="_blank" onclick="track('outbound_click')">External Link</a>
</div>

<div class="section">
  <h3>Video</h3>
  <video id="video" width="320" controls>
    <source src="https://www.w3schools.com/html/mov_bbb.mp4">
  </video>
</div>

<div class="section">
  <h3>UI Interactions</h3>
  <button onclick="track('accordion_click')">Accordion</button>
  <button onclick="track('tab_click')">Tab</button>
  <button onclick="track('menu_click')">Menu</button>
  <button onclick="track('filter_apply')">Filter</button>
  <button onclick="track('sort_click')">Sort</button>
</div>

<div class="section">
  <h3>Engagement</h3>
  <button onclick="track('add_to_favorites')">Favorite</button>
  <button onclick="track('share')">Share</button>
</div>

<div class="section">
  <h3>Map</h3>
  <div onclick="track('map_click')" style="height:200px;background:lightblue;">Map</div>
</div>

<div class="big"></div>

<div class="section hidden" id="visibleBox">
  Element Visibility
</div>

<script>
window.dataLayer = window.dataLayer || [];

// universal tracker
function track(name){
  dataLayer.push({ event: name });
}

// page view
track("page_view");

// form events
const form = document.getElementById("form");

form.addEventListener("focusin", () => track("form_start"));

form.addEventListener("submit", () => {
  track("form_submit");
  track("generate_lead");
});

// video
const video = document.getElementById("video");

video.addEventListener("play", () => track("video_start"));

video.addEventListener("timeupdate", () => {
  if(video.currentTime > video.duration*0.5){
    track("video_progress");
  }
});

video.addEventListener("ended", () => track("video_complete"));

// scroll
let fired = {};
window.addEventListener("scroll", () => {
  let p = (window.scrollY/(document.body.scrollHeight-window.innerHeight))*100;

  if(p>25 && !fired[25]){ track("scroll_depth_25"); fired[25]=true; }
  if(p>50 && !fired[50]){ track("scroll_depth_50"); fired[50]=true; }
  if(p>75 && !fired[75]){ track("scroll_depth_75"); fired[75]=true; }
  if(p>95 && !fired[100]){ track("scroll_depth_100"); fired[100]=true; }
});

// element visibility
new IntersectionObserver(e=>{
  e.forEach(x=>{
    if(x.isIntersecting) track("element_visibility");
  });
}).observe(document.getElementById("visibleBox"));

// copy
document.addEventListener("copy", ()=>track("copy_text"));

// time on page
setTimeout(()=>track("time_on_page"), 10000);

// error
window.addEventListener("error", ()=>track("error_event"));

// fake 404 trigger (for practice)
if(location.hash === "#404"){
  track("page_not_found");
}
</script>

</body>
</html>
