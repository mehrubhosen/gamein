<!DOCTYPE html>
<html>
<head>
  <title>Mini E-commerce</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    .hidden { display: none; }
    .product { border: 1px solid #ccc; padding: 10px; margin: 10px; }
    button { margin-top: 5px; }
  </style>
</head>
<body>

<h1>🛒 Mini E-commerce</h1>

<!-- NAV -->
<button onclick="showPage('shop')">Shop</button>
<button onclick="showPage('cart')">Cart</button>
<button onclick="showPage('signup')">Signup</button>

<hr>

<!-- SHOP PAGE -->
<div id="shop">
  <h2>Products</h2>

  <div class="product">
    <h3>Product 1</h3>
    <p>$10</p>
    <button onclick="addToCart('Product 1',10)">Add to Cart</button>
  </div>

  <div class="product">
    <h3>Product 2</h3>
    <p>$20</p>
    <button onclick="addToCart('Product 2',20)">Add to Cart</button>
  </div>
</div>

<!-- CART PAGE -->
<div id="cart" class="hidden">
  <h2>Your Cart</h2>
  <ul id="cartItems"></ul>
  <h3 id="total"></h3>
  <button onclick="showPage('checkout')">Go to Checkout</button>
</div>

<!-- CHECKOUT PAGE -->
<div id="checkout" class="hidden">
  <h2>Checkout</h2>

  <form onsubmit="checkout(event)">
    <input type="text" placeholder="Name" required><br><br>
    <input type="text" placeholder="Address" required><br><br>
    <button type="submit">Place Order</button>
  </form>
</div>

<!-- SIGNUP PAGE -->
<div id="signup" class="hidden">
  <h2>Signup</h2>

  <form onsubmit="signup(event)">
    <input type="email" id="email" placeholder="Email" required><br><br>
    <input type="password" id="password" placeholder="Password" required><br><br>
    <button type="submit">Sign Up</button>
  </form>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

// Show page
function showPage(page) {
  document.querySelectorAll("div").forEach(div => div.classList.add("hidden"));
  document.getElementById(page).classList.remove("hidden");

  if (page === "cart") loadCart();
}

// Add to cart
function addToCart(name, price) {
  cart.push({ name, price });
  localStorage.setItem("cart", JSON.stringify(cart));
  alert("Added to cart!");
}

// Load cart
function loadCart() {
  let list = document.getElementById("cartItems");
  list.innerHTML = "";

  let total = 0;

  cart.forEach((item, index) => {
    total += item.price;

    let li = document.createElement("li");
    li.innerHTML = item.name + " - $" + item.price +
      ` <button onclick="removeItem(${index})">❌</button>`;
    list.appendChild(li);
  });

  document.getElementById("total").innerText = "Total: $" + total;
}

// Remove item
function removeItem(index) {
  cart.splice(index, 1);
  localStorage.setItem("cart", JSON.stringify(cart));
  loadCart();
}

// Checkout
function checkout(e) {
  e.preventDefault();
  alert("✅ Order placed!");
  localStorage.removeItem("cart");
  cart = [];
  showPage("shop");
}

// Signup
function signup(e) {
  e.preventDefault();

  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;

  localStorage.setItem("user", JSON.stringify({ email, password }));

  alert("Signup successful!");
  showPage("shop");
}
</script>

</body>
</html>
