<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google Tag Manager -->
<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','GTM-PND3KKQL');</script>
<!-- End Google Tag Manager -->
<meta charset="UTF-8">
<title>Event Tracking Practice</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  padding: 0;
}

header {
  background: #222;
  color: white;
  padding: 15px;
}

nav a {
  margin-right: 10px;
  color: white;
  cursor: pointer;
}

.section {
  padding: 40px;
  border-bottom: 1px solid #ccc;
}

button {
  padding: 10px;
  margin: 5px;
}

.big-box {
  height: 800px;
  background: lightgray;
}

.hidden-box {
  margin-top: 200px;
  padding: 20px;
  background: orange;
}
</style>
</head>

<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PND3KKQL"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<header>
  <h2>Tracking Practice Website</h2>
  <nav>
    <a onclick="navClick()">Home</a>
    <a onclick="navClick()">About</a>
    <a onclick="navClick()">Contact</a>
  </nav>
</header>

<div class="section">
  <h3>Buttons</h3>
  <button onclick="buttonClick()">Click Me</button>
  <button onclick="phoneClick()">Call</button>
  <button onclick="emailClick()">Email</button>
  <button onclick="whatsappClick()">WhatsApp</button>
</div>

<div class="section">
  <h3>Form</h3>
  <form id="form">
    <input type="text" placeholder="Name" required><br><br>
    <input type="email" placeholder="Email" required><br><br>
    <button type="submit">Submit</button>
  </form>
</div>

<div class="section">
  <h3>Search</h3>
  <input type="text" placeholder="Search..." oninput="searchEvent()">
</div>

<div class="section">
  <h3>Download</h3>
  <a href="#" onclick="downloadFile()">Download PDF</a>
</div>

<div class="section">
  <h3>Video</h3>
  <video width="320" controls id="video">
    <source src="https://www.w3schools.com/html/mov_bbb.mp4">
  </video>
</div>

<div class="section">
  <h3>Accordion</h3>
  <button onclick="accordionClick()">Open Accordion</button>
</div>

<div class="section">
  <h3>Tabs</h3>
  <button onclick="tabClick()">Tab 1</button>
  <button onclick="tabClick()">Tab 2</button>
</div>

<div class="section">
  <h3>Menu / Filter / Sort</h3>
  <button onclick="menuClick()">Menu</button>
  <button onclick="filterApply()">Filter</button>
  <button onclick="sortClick()">Sort</button>
</div>

<div class="section">
  <h3>Favorites / Share</h3>
  <button onclick="fav()">Add to Favorites</button>
  <button onclick="share()">Share</button>
</div>

<div class="section">
  <h3>Map Click</h3>
  <div onclick="mapClick()" style="background:lightblue;height:200px;">Map Area</div>
</div>

<div class="section big-box">
  <h3>Scroll Area</h3>
</div>

<div class="section hidden-box" id="visibleBox">
  <h3>Element Visibility</h3>
</div>

<script>
// DataLayer
window.dataLayer = window.dataLayer || [];

// Basic Events
dataLayer.push({ event: "page_view" });

function buttonClick() {
  dataLayer.push({ event: "button_click" });
}

function navClick() {
  dataLayer.push({ event: "navigation_click" });
}

function phoneClick() {
  dataLayer.push({ event: "phone_click" });
}

function emailClick() {
  dataLayer.push({ event: "email_click" });
}

function whatsappClick() {
  dataLayer.push({ event: "whatsapp_click" });
}

// Form
document.getElementById("form").addEventListener("submit", function() {
  dataLayer.push({ event: "form_submit" });
});

// Search
function searchEvent() {
  dataLayer.push({ event: "search" });
}

// Download
function downloadFile() {
  dataLayer.push({ event: "file_download" });
}

// Accordion / Tabs
function accordionClick() {
  dataLayer.push({ event: "accordion_click" });
}

function tabClick() {
  dataLayer.push({ event: "tab_click" });
}

// Menu / Filter / Sort
function menuClick() {
  dataLayer.push({ event: "menu_click" });
}

function filterApply() {
  dataLayer.push({ event: "filter_apply" });
}

function sortClick() {
  dataLayer.push({ event: "sort_click" });
}

// Favorites / Share
function fav() {
  dataLayer.push({ event: "add_to_favorites" });
}

function share() {
  dataLayer.push({ event: "share" });
}

// Map
function mapClick() {
  dataLayer.push({ event: "map_click" });
}

// Scroll Tracking
window.addEventListener("scroll", () => {
  let scrollPercent = (window.scrollY / (document.body.scrollHeight - window.innerHeight)) * 100;

  if (scrollPercent > 25) dataLayer.push({ event: "scroll_25" });
  if (scrollPercent > 50) dataLayer.push({ event: "scroll_50" });
  if (scrollPercent > 75) dataLayer.push({ event: "scroll_75" });
  if (scrollPercent > 100) dataLayer.push({ event: "scroll_100" });
});

// Element Visibility
const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      dataLayer.push({ event: "element_visibility" });
    }
  });
});
observer.observe(document.getElementById("visibleBox"));

// Video Tracking
const video = document.getElementById("video");

video.addEventListener("play", () => {
  dataLayer.push({ event: "video_start" });
});

video.addEventListener("timeupdate", () => {
  if (video.currentTime > video.duration * 0.5) {
    dataLayer.push({ event: "video_progress" });
  }
});

video.addEventListener("ended", () => {
  dataLayer.push({ event: "video_complete" });
});

// Copy Text
document.addEventListener("copy", () => {
  dataLayer.push({ event: "copy_text" });
});

// Error Event
window.addEventListener("error", () => {
  dataLayer.push({ event: "error_event" });
});
</script>

</body>
</html>
