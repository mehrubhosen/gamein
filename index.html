<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Tracking Lab - Full Funnel</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .section { display: none; padding: 20px; border: 1px solid #eee; border-radius: 8px; margin-top: 20px; }
        .active { display: block; }
        .product-box { border: 1px solid #ddd; padding: 15px; border-radius: 5px; text-align: center; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: 0.3s; }
        .btn-add { background: #ffc107; color: black; }
        .btn-next { background: #007bff; color: white; width: 100%; margin-top: 20px; }
        .btn-buy { background: #28a745; color: white; width: 100%; }
        .nav-steps { display: flex; justify-content: space-around; margin-bottom: 20px; font-weight: bold; color: #999; }
        .nav-steps .active-step { color: #007bff; border-bottom: 2px solid #007bff; }
        #log-screen { background: #222; color: #0f0; padding: 10px; font-family: monospace; font-size: 12px; margin-top: 20px; height: 80px; overflow-y: auto; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="text-align: center;">🚀 Full Funnel Tracking Lab</h2>
        
        <div class="nav-steps">
            <span id="s1" class="active-step">1. Product</span>
            <span id="s2">2. Cart</span>
            <span id="s3">3. Checkout</span>
        </div>

        <div id="step1" class="section active">
            <div class="product-box">
                <img src="https://via.placeholder.com/150" alt="Product">
                <h3>Smartphone X1</h3>
                <p>Price: ৳25,000</p>
                <button class="btn btn-add" onclick="addToCart()">Add to Cart</button>
            </div>
            <button class="btn btn-next" onclick="showStep(2, 'view_cart')">Go to Cart 🛒</button>
        </div>

        <div id="step2" class="section">
            <h3>Your Shopping Cart</h3>
            <div style="border-bottom: 1px solid #eee; padding-bottom: 10px;">
                <p>Smartphone X1 - 1pc - ৳25,000</p>
            </div>
            <p><strong>Total: ৳25,000</strong></p>
            <button class="btn btn-next" onclick="showStep(3, 'begin_checkout')">Proceed to Checkout 💳</button>
        </div>

        <div id="step3" class="section">
            <h3>Checkout Details</h3>
            <input type="text" placeholder="Name" style="width:90%; padding:10px; margin-bottom:10px;"><br>
            <input type="email" id="userEmail" placeholder="Email" style="width:90%; padding:10px; margin-bottom:10px;">
            <p>Payment Method: Cash on Delivery</p>
            <button class="btn btn-buy" onclick="completePurchase()">Complete Order (Purchase)</button>
        </div>

        <div id="log-screen">> System ready. Waiting for user action...</div>
    </div>

    <script>
        window.dataLayer = window.dataLayer || [];

        function log(msg) {
            const screen = document.getElementById('log-screen');
            screen.innerHTML += "<br>> " + msg;
            screen.scrollTop = screen.scrollHeight;
        }

        // Helper to switch steps
        function showStep(stepNum, eventName) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById('step' + stepNum).classList.add('active');
            
            document.querySelectorAll('.nav-steps span').forEach(s => s.classList.remove('active-step'));
            document.getElementById('s' + stepNum).classList.add('active-step');

            // Fire Data Layer Event
            window.dataLayer.push({
                'event': eventName,
                'ecommerce': {
                    'currency': 'BDT',
                    'value': 25000,
                    'items': [{ 'item_name': 'Smartphone X1', 'price': 25000 }]
                }
            });
            log(eventName + " event pushed to Data Layer.");
        }

        function addToCart() {
            window.dataLayer.push({
                'event': 'add_to_cart',
                'ecommerce': {
                    'currency': 'BDT',
                    'value': 25000,
                    'items': [{ 'item_name': 'Smartphone X1', 'item_id': 'SP-X1', 'price': 25000, 'quantity': 1 }]
                }
            });
            log("add_to_cart event pushed.");
            alert("Added to cart!");
        }

        function completePurchase() {
            const email = document.getElementById('userEmail').value;
            const tID = "ORD-" + Math.floor(Math.random() * 100000);
            
            window.dataLayer.push({
                'event': 'purchase',
                'ecommerce': {
                    'transaction_id': tID,
                    'value': 25000,
                    'currency': 'BDT',
                    'customer_email': email, // Useful for Enhanced Conversions
                    'items': [{ 'item_name': 'Smartphone X1', 'item_id': 'SP-X1', 'price': 25000, 'quantity': 1 }]
                }
            });
            
            log("PURCHASE SUCCESS! ID: " + tID);
            alert("Order Completed! Transaction ID: " + tID);
            location.reload(); // Reset for next practice
        }
    </script>
</body>
</html>
