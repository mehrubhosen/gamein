<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Tracking Lab</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
        .btn { display: block; width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        .signup { background-color: #007bff; color: white; }
        .view-cart { background-color: #6c757d; color: white; }
        .add-cart { background-color: #ffc107; color: black; }
        .checkout { background-color: #17a2b8; color: white; }
        .purchase { background-color: #28a745; color: white; }
        .btn:hover { opacity: 0.8; }
        .log-box { margin-top: 20px; padding: 10px; background: #222; color: #0f0; font-family: monospace; font-size: 12px; border-radius: 5px; text-align: left; height: 100px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🛒 E-commerce Tracking Lab</h2>
        <p>Click the buttons to fire Data Layer events</p>

        <button class="btn signup" onclick="fireSignUp()">1. User Sign Up</button>
        <button class="btn add-cart" onclick="fireAddToCart()">2. Add to Cart (৳2500)</button>
        <button class="btn view-cart" onclick="fireViewCart()">3. View Cart</button>
        <button class="btn checkout" onclick="fireBeginCheckout()">4. Begin Checkout</button>
        <button class="btn purchase" onclick="firePurchase()">5. Complete Purchase (৳2500)</button>

        <div class="log-box" id="log">Console: Waiting for actions...</div>
    </div>

    <script>
        window.dataLayer = window.dataLayer || [];

        function logEvent(msg) {
            const log = document.getElementById('log');
            log.innerHTML += "> " + msg + "<br>";
            log.scrollTop = log.scrollHeight;
        }

        // 1. Sign Up Event
        function fireSignUp() {
            window.dataLayer.push({
                'event': 'sign_up',
                'method': 'Google'
            });
            logEvent("Event: sign_up fired!");
        }

        // 2. Add to Cart Event
        function fireAddToCart() {
            window.dataLayer.push({
                'event': 'add_to_cart',
                'ecommerce': {
                    'currency': 'BDT',
                    'value': 2500,
                    'items': [{
                        'item_name': 'Smart Watch',
                        'item_id': 'SW-101',
                        'price': 2500,
                        'quantity': 1
                    }]
                }
            });
            logEvent("Event: add_to_cart fired (৳2500)");
        }

        // 3. View Cart
        function fireViewCart() {
            window.dataLayer.push({
                'event': 'view_cart',
                'ecommerce': {
                    'currency': 'BDT',
                    'value': 2500,
                    'items': [{ 'item_name': 'Smart Watch', 'price': 2500 }]
                }
            });
            logEvent("Event: view_cart fired!");
        }

        // 4. Begin Checkout
        function fireBeginCheckout() {
            window.dataLayer.push({
                'event': 'begin_checkout',
                'ecommerce': {
                    'currency': 'BDT',
                    'value': 2500,
                    'items': [{ 'item_name': 'Smart Watch', 'price': 2500 }]
                }
            });
            logEvent("Event: begin_checkout fired!");
        }

        // 5. Purchase
        function firePurchase() {
            const tID = "TRX-" + Math.floor(Math.random() * 999999);
            window.dataLayer.push({
                'event': 'purchase',
                'ecommerce': {
                    'transaction_id': tID,
                    'value': 2500,
                    'currency': 'BDT',
                    'items': [{
                        'item_name': 'Smart Watch',
                        'item_id': 'SW-101',
                        'price': 2500,
                        'quantity': 1
                    }]
                }
            });
            logEvent("Event: purchase fired! ID: " + tID);
        }
    </script>
</body>
</html>
